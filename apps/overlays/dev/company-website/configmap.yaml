kind: ConfigMap
metadata:
  name: company-website-html
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <meta name="theme-color" content="#0a0a0a">
      <meta name="description" content="Guerrero Plumbing Co. — Precision, pressure, performance. Professional plumbing services in the Inland Empire & Orange County. Call 844-GIT-PIPE.">
      <title>Guerrero Plumbing Co. — Inland Empire & Orange County Plumbing</title>
    
      <meta property="og:title" content="Guerrero Plumbing Co.">
      <meta property="og:description" content="Precision. Pressure. Performance. Plumbing services throughout the Inland Empire & Orange County.">
      <meta property="og:type" content="website">
      <meta property="og:url" content="https://guerreroplumbingco.com">
    
      <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%230a0a0a'/%3E%3Ctext x='50' y='68' text-anchor='middle' font-family='Georgia,serif' font-weight='700' font-size='58' fill='%23C0C0C0'%3EG%3C/text%3E%3Crect x='0' y='94' width='50' height='6' fill='%23D71920'/%3E%3Crect x='50' y='94' width='50' height='6' fill='%230057FF'/%3E%3C/svg%3E">
    
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
      <style>
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
        :root{
          --red:#D71920;--blue:#0057FF;--silver:#C0C0C0;
          --bg:#0a0a0a;--bg2:#050505;--card:#141414;
          --border:rgba(192,192,192,.10);--border2:rgba(192,192,192,.25);
          --text:#E5E5E5;--muted:#8a8a8a;
          --head:'Oswald',sans-serif;
          --body:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
        }
        html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
        body{font-family:var(--body);background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased}
        a{color:inherit;text-decoration:none}
        img{max-width:100%;display:block}
    
        .container{max-width:1180px;margin:0 auto;padding:0 24px}
        .stripe{height:3px;background:linear-gradient(90deg,var(--red) 0%,var(--red) 50%,var(--blue) 50%,var(--blue) 100%)}
    
        /* HEADER */
        header{position:sticky;top:0;z-index:50;background:rgba(10,10,10,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--border)}
        .head-in{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;max-width:1180px;margin:0 auto;gap:16px}
        .brand{font-family:var(--head);font-weight:700;font-size:16px;letter-spacing:2.5px;color:var(--silver);white-space:nowrap}
        .brand .co{color:var(--red)}
        nav{display:flex;gap:28px}
        nav a{font-size:14px;color:var(--muted);font-weight:500;transition:color .15s}
        nav a:hover{color:var(--silver)}
        .call-btn{display:inline-flex;align-items:center;gap:8px;background:var(--red);color:#fff;padding:10px 18px;border-radius:4px;font-weight:600;font-size:14px;letter-spacing:.5px;transition:all .15s}
        .call-btn:hover{background:#b8151b;transform:translateY(-1px)}
        .call-btn svg{width:16px;height:16px}
        @media(max-width:820px){nav{display:none}}
        @media(max-width:480px){.call-btn .num{display:none}}
    
        /* HERO */
        .hero{min-height:92vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:60px 24px;position:relative;overflow:hidden;
          background:radial-gradient(ellipse at 20% 20%,rgba(0,87,255,.10),transparent 55%),radial-gradient(ellipse at 80% 80%,rgba(215,25,32,.10),transparent 55%),var(--bg)}
        .hero-in{max-width:720px;position:relative;z-index:1}
        .hero-logo{width:300px;max-width:65vw;margin:0 auto 32px;filter:drop-shadow(0 25px 50px rgba(0,0,0,.6))}
        .tag{font-family:var(--head);color:var(--silver);font-size:13px;letter-spacing:5px;text-transform:uppercase;margin-bottom:24px}
        .tag .dot{color:var(--red);margin:0 8px}
        .tag .dot2{color:var(--blue)}
        .hero-desc{color:#b5b5b5;font-size:18px;margin:0 auto 40px;max-width:520px}
        .cta-row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
        .btn{display:inline-flex;align-items:center;gap:10px;padding:16px 30px;border-radius:6px;font-family:var(--head);font-weight:600;font-size:16px;letter-spacing:1.5px;text-transform:uppercase;transition:all .2s;cursor:pointer;border:0}
        .btn-p{background:var(--red);color:#fff;box-shadow:0 12px 30px rgba(215,25,32,.28)}
        .btn-p:hover{background:#b8151b;transform:translateY(-2px);box-shadow:0 18px 40px rgba(215,25,32,.38)}
        .btn-g{background:transparent;color:var(--silver);border:1px solid var(--border2)}
        .btn-g:hover{background:rgba(255,255,255,.04);border-color:var(--silver)}
        .btn svg{width:18px;height:18px}
    
        /* SECTION */
        section{padding:100px 0;position:relative}
        .sec-label{font-family:var(--head);color:var(--red);font-size:12px;letter-spacing:5px;text-transform:uppercase;margin-bottom:14px;display:inline-block;padding:6px 14px;background:rgba(215,25,32,.08);border:1px solid rgba(215,25,32,.25);border-radius:3px}
        .sec-label.blue{color:var(--blue);background:rgba(0,87,255,.08);border-color:rgba(0,87,255,.25)}
        h2.sec-title{font-family:var(--head);color:var(--silver);font-size:clamp(30px,4.5vw,44px);font-weight:700;letter-spacing:.5px;line-height:1.1;margin:6px 0 18px;text-transform:uppercase}
        .sec-sub{color:var(--muted);font-size:17px;max-width:640px;margin-bottom:56px}
    
        /* SERVICES */
        .services{background:var(--bg2)}
        .svc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px}
        .svc{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:32px 26px;transition:all .25s;position:relative;overflow:hidden}
        .svc::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--red),var(--blue));transform:scaleX(0);transform-origin:left;transition:transform .3s}
        .svc:hover{transform:translateY(-4px);border-color:var(--border2)}
        .svc:hover::before{transform:scaleX(1)}
        .svc-ico{width:52px;height:52px;background:linear-gradient(135deg,rgba(215,25,32,.15),rgba(0,87,255,.15));border:1px solid rgba(215,25,32,.2);border-radius:10px;display:flex;align-items:center;justify-content:center;margin-bottom:22px;color:var(--red)}
        .svc-ico svg{width:26px;height:26px}
        .svc h3{font-family:var(--head);color:var(--silver);font-size:20px;font-weight:700;letter-spacing:1.2px;margin-bottom:10px;text-transform:uppercase}
        .svc p{color:var(--muted);font-size:14.5px}
    
        /* AREAS */
        .areas-grid{display:grid;grid-template-columns:1fr 1fr;gap:44px}
        .area h4{font-family:var(--head);color:var(--red);font-size:13px;letter-spacing:4px;text-transform:uppercase;margin-bottom:20px;padding-bottom:12px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
        .area:nth-child(2) h4{color:var(--blue)}
        .area h4::before{content:'';width:24px;height:2px;background:currentColor}
        .cities{display:grid;grid-template-columns:1fr 1fr;gap:6px 20px;list-style:none}
        .cities li{color:var(--text);font-size:15px;padding:8px 0;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(192,192,192,.04)}
        .cities li svg{width:14px;height:14px;color:var(--red);flex-shrink:0}
        .area:nth-child(2) .cities li svg{color:var(--blue)}
        @media(max-width:768px){.areas-grid{grid-template-columns:1fr;gap:40px}}
    
        /* VALUES */
        .values{background:var(--bg2)}
        .val-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:28px}
        .val{padding:8px 0}
        .val .n{font-family:var(--head);color:var(--red);font-size:38px;font-weight:700;display:block;line-height:1;margin-bottom:12px;letter-spacing:1px}
        .val:nth-child(2) .n{color:var(--silver)}
        .val:nth-child(3) .n{color:var(--blue)}
        .val h4{font-family:var(--head);color:var(--silver);font-size:19px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:8px}
        .val p{color:var(--muted);font-size:14.5px}
    
        /* CONTACT */
        .contact{padding-bottom:60px}
        .contact-grid{display:grid;grid-template-columns:1.2fr 1fr;gap:40px;align-items:start}
        @media(max-width:820px){.contact-grid{grid-template-columns:1fr}}
        .contact-card{background:linear-gradient(135deg,rgba(215,25,32,.10),rgba(0,87,255,.10));border:1px solid var(--border);border-radius:14px;padding:44px 36px;text-align:center}
        .contact-phone{font-family:var(--head);font-size:clamp(30px,5vw,44px);color:var(--silver);font-weight:700;letter-spacing:2px;display:inline-block;margin:14px 0 10px;transition:color .15s}
        .contact-phone:hover{color:#fff}
        .contact-note{color:var(--muted);font-size:14px;margin-bottom:26px}
    
        .team{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:36px 32px}
        .team h3{font-family:var(--head);color:var(--silver);font-size:20px;font-weight:700;letter-spacing:2px;text-transform:uppercase;margin-bottom:6px}
        .team .sub{color:var(--muted);font-size:14px;margin-bottom:26px}
        .person{padding:18px 0;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
        .person:first-of-type{border-top:0;padding-top:0}
        .person .who{display:flex;flex-direction:column}
        .person .name{color:var(--silver);font-family:var(--head);font-size:16px;font-weight:600;letter-spacing:1px}
        .person .role{color:var(--muted);font-size:13px;letter-spacing:.5px;margin-top:2px}
        .person .email{color:var(--red);font-size:14px;font-weight:500}
        .person:nth-of-type(2) .email{color:var(--blue)}
        .person .email:hover{text-decoration:underline}
    
        .hours{margin-top:26px;padding-top:22px;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:14px}
        .hours strong{color:var(--silver);font-family:var(--head);letter-spacing:1.5px}
    
        /* FOOTER */
        footer{background:var(--bg2);border-top:1px solid var(--border);padding:44px 0 30px;text-align:center}
        .foot-brand{font-family:var(--head);color:var(--silver);font-weight:700;letter-spacing:3px;font-size:15px;margin-bottom:8px}
        .foot-tag{color:var(--muted);font-size:13px;letter-spacing:2px;margin-bottom:22px}
        .license{display:inline-flex;align-items:center;gap:8px;padding:8px 16px;background:rgba(192,192,192,.04);border:1px solid var(--border);border-radius:20px;color:var(--muted);font-size:12px;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:22px}
        .license .pulse{width:8px;height:8px;background:var(--blue);border-radius:50%;box-shadow:0 0 0 0 rgba(0,87,255,.6);animation:p 2s infinite}
        @keyframes p{0%{box-shadow:0 0 0 0 rgba(0,87,255,.5)}70%{box-shadow:0 0 0 10px rgba(0,87,255,0)}100%{box-shadow:0 0 0 0 rgba(0,87,255,0)}}
        .foot-copy{color:var(--muted);font-size:12.5px;letter-spacing:.5px}
    
        @media(max-width:768px){section{padding:70px 0}.head-in{padding:12px 20px}.container{padding:0 20px}}
      </style>
    </head>
    <body>
      <div class="stripe"></div>
    
      <header>
        <div class="head-in">
          <a href="#" class="brand">GUERRERO <span class="co">PLUMBING CO.</span></a>
          <nav>
            <a href="#services">Services</a>
            <a href="#areas">Service Areas</a>
            <a href="#contact">Contact</a>
          </nav>
          <a href="tel:+18444487473" class="call-btn">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
            <span class="num">844-GIT-PIPE</span>
          </a>
        </div>
      </header>
    
      <section class="hero">
        <div class="hero-in">
          <img src="data:image/webp;base64," alt="Guerrero Plumbing Co." class="hero-logo">
          <div class="tag">Precision<span class="dot">·</span>Pressure<span class="dot dot2">·</span>Performance</div>
          <p class="hero-desc">Professional plumbing services throughout the Inland Empire and Orange County. Repairs, repipes, drains, and water heaters — done right the first time.</p>
          <div class="cta-row">
            <a href="tel:+18444487473" class="btn btn-p">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
              Call 844-GIT-PIPE
            </a>
            <a href="#services" class="btn btn-g">Our Services</a>
          </div>
        </div>
      </section>
    
      <section id="services" class="services">
        <div class="container">
          <span class="sec-label">What We Do</span>
          <h2 class="sec-title">Complete Plumbing Services</h2>
          <p class="sec-sub">Residential and commercial plumbing solutions delivered with clean workmanship and honest, upfront pricing.</p>
          <div class="svc-grid">
            <div class="svc">
              <div class="svc-ico"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg></div>
              <h3>Plumbing</h3>
              <p>General repairs, installations, fixture replacement, and diagnostics for homes and businesses across Southern California.</p>
            </div>
            <div class="svc">
              <div class="svc-ico"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v4M16 2v4M3 10h18M5 6h14a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2z"/></svg></div>
              <h3>Repipe Specialist</h3>
              <p>Full-home repipes using PEX and copper. Old galvanized and polybutylene replaced with modern, reliable materials.</p>
            </div>
            <div class="svc">
              <div class="svc-ico"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg></div>
              <h3>Drain Cleaning</h3>
              <p>Clogged drains, sewer lines, hydro-jetting, and camera inspection. Fast diagnosis, permanent solutions.</p>
            </div>
            <div class="svc">
              <div class="svc-ico"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg></div>
              <h3>Water Heaters</h3>
              <p>Tank and tankless installation, repair, and replacement. Gas and electric systems — sized right for your home.</p>
            </div>
          </div>
        </div>
      </section>
    
      <section id="areas">
        <div class="container">
          <span class="sec-label blue">Where We Work</span>
          <h2 class="sec-title">Serving the Inland Empire & Orange County</h2>
          <p class="sec-sub">Locally based and ready to dispatch across both counties. Don't see your city? Give us a call — we probably cover it.</p>
          <div class="areas-grid">
            <div class="area">
              <h4>Inland Empire</h4>
              <ul class="cities">
                <li><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/></svg>Riverside</li>
                <li><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/></svg>San Bernardino</li>
                <li><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/></svg>Corona</li>
                <li><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/></svg>Fontana</li>
                <li><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/></svg>Ontario</li>
                <li><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/></svg>Rancho Cucamonga</li>
                <li><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/></svg>Moreno Valley</li>
                <li><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/></svg>Redlands</li>
              </ul>
            </div>
            <div class="area">
              <h4>Orange County</h4>
              <ul class="cities">
                <li><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/></svg>Anaheim</li>
                <li><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/></svg>Santa Ana</li>
                <li><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/></svg>Irvine</li>
                <li><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/></svg>Fullerton</li>
                <li><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/></svg>Huntington Beach</li>
                <li><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/></svg>Orange</li>
                <li><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/></svg>Garden Grove</li>
                <li><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/></svg>Costa Mesa</li>
              </ul>
            </div>
          </div>
        </div>
      </section>
    
      <section class="values">
        <div class="container">
          <span class="sec-label">Why Guerrero</span>
          <h2 class="sec-title">Built on Craftsmanship</h2>
          <p class="sec-sub">A new name in Southern California plumbing — backed by uncompromising standards.</p>
          <div class="val-grid">
            <div class="val">
              <span class="n">01</span>
              <h4>Upfront Pricing</h4>
              <p>Clear, written quotes before any work begins. No surprise charges, no shortcuts.</p>
            </div>
            <div class="val">
              <span class="n">02</span>
              <h4>Family Owned</h4>
              <p>Locally owned and operated. You'll talk directly to the people doing the work.</p>
            </div>
            <div class="val">
              <span class="n">03</span>
              <h4>Quality Workmanship</h4>
