apiVersion: v1
kind: ConfigMap
metadata:
  name: company-website-html
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guerrero Plumbing Co. — Coming Soon</title>
    <style>
      :root {
        --red: #c0392b;
        --blue: #1f3a5f;
        --silver: #b8bcc2;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, var(--blue) 0%, #10203a 100%);
        color: #fff;
        font-family: 'Segoe UI', Arial, sans-serif;
        text-align: center;
        padding: 20px;
      }
      .logo-placeholder {
        width: 120px;
        height: 120px;
        border-radius: 50%;
        background: var(--silver);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 40px;
        font-weight: bold;
        color: var(--blue);
        margin-bottom: 24px;
        border: 4px solid var(--red);
      }
      h1 {
        font-size: 2.2rem;
        margin: 0 0 8px;
        letter-spacing: 1px;
      }
      .tagline {
        color: var(--silver);
        font-size: 1rem;
        letter-spacing: 3px;
        text-transform: uppercase;
        margin-bottom: 32px;
      }
      .badge {
        background: var(--red);
        padding: 10px 24px;
        border-radius: 4px;
        font-size: 1rem;
        letter-spacing: 2px;
        text-transform: uppercase;
        font-weight: 600;
      }
      footer {
        position: absolute;
        bottom: 20px;
        font-size: 0.8rem;
        color: var(--silver);
        opacity: 0.7;
      }
    </style>
    </head>
    <body>
      <div class="logo-placeholder">GP</div>
      <h1>Guerrero Plumbing Co.</h1>
      <div class="tagline">Precision. Pressure. Performance.</div>
      <div class="badge">Site Coming Soon</div>
      <footer>&copy; 2026 Guerrero Plumbing Co.</footer>
    </body>
    </html>
